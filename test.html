<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matematický test</title><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="test.css"></head><body><header class="masthead"><span class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Matematický test</span><span class="practice">Čas řešení <time id="timer">00:00</time></span></header><div class="layout"><aside aria-label="Otázky testu"><span class="rail-title">TVŮJ POSTUP</span><ol id="steps"></ol><p class="rail-note" id="progress"></p></aside><div class="workspace"><main id="question" tabindex="-1"></main><footer><button id="pad-toggle" class="tool" aria-pressed="false" aria-controls="keypad">▦ Číselná klávesnice</button><div class="navigation"><button id="prev" class="secondary">← Zpět</button><button id="next" class="primary">Další otázka →</button><button id="finish" class="secondary">Odevzdat test</button></div></footer></div></div><p class="test-note">Odpovědi můžeš před odevzdáním měnit.</p><div id="announcement" class="sr-only" role="status"></div><dialog id="confirm"><h2>Odevzdat test?</h2><p id="confirm-text"></p><div class="row"><button id="cancel" class="secondary">Vrátit se k testu</button><button id="submit" class="primary">Odevzdat</button></div></dialog><section id="keypad" class="floating keypad" aria-label="Číselná klávesnice" hidden><div class="floating-head"><button class="drag-handle" id="pad-handle" aria-label="Přesunout klávesnici, lze také šipkami na klávesnici">✥ Číselná klávesnice</button><button id="pad-close" aria-label="Zavřít klávesnici">×</button></div><p id="pad-target">Vyber odpovědní pole.</p><div id="keys"></div></section>
