<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rady pro vyplnění testu</title><meta name="description" content="Vyzkoušej si ovládání matematického testu krok za krokem."><link rel="stylesheet" href="rady.css?v=3"></head><body>
<header class="masthead"><a class="brand" href="index.html" aria-label="Rady od začátku"><span class="brand-mark" aria-hidden="true">✦</span> Rady pro vyplnění testu</a><span class="practice">Procvičování · bez časového limitu</span></header>
<div class="layout"><aside aria-label="Kroky návodu"><span class="rail-title">TVŮJ POSTUP</span><ol id="steps"></ol><p class="rail-note">K předchozím krokům se můžeš vracet.</p></aside><div class="workspace"><main id="content" tabindex="-1"></main><footer><div class="tools"><button id="ruler-toggle" class="tool" aria-pressed="false" aria-controls="ruler" title="Otevřít pravítko">▱ <span>Pravítko</span></button><button id="pad-toggle" class="tool" aria-pressed="false" aria-controls="keypad" title="Otevřít číselnou klávesnici">▦ <span>Číselná klávesnice</span></button></div><div class="navigation"><button id="back" class="secondary">← Zpět</button><button id="next" class="primary">Další krok →</button></div></footer></div></div>
<div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
<section id="ruler" class="floating ruler" aria-label="Pohyblivé pravítko" hidden><svg id="ruler-scale" viewBox="0 0 440 72" tabindex="0" role="img" aria-label="Pravítko 0 až 10 centimetrů. Táhni myší pro přesun nebo použij šipky."></svg><button id="ruler-rotate" aria-label="Otočit pravítko. Táhni myší, nebo použij šipky vlevo a vpravo." title="Táhni pro otočení">↻</button><button id="ruler-close" aria-label="Skrýt pravítko" title="Skrýt pravítko">×</button></section>
<section id="keypad" class="floating keypad" aria-label="Číselná klávesnice" hidden><div class="floating-head"><button class="drag-handle" id="pad-handle" aria-label="Přesunout klávesnici, lze také šipkami na klávesnici">✥ Číselná klávesnice</button><button id="pad-close" aria-label="Zavřít klávesnici">×</button></div><p id="pad-target">Vyber odpovědní pole.</p><div id="keys"></div></section>
<script src="rady.js?v=3"></script></body></html>
